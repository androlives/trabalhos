# ==========================================================
# DATASOURCE - H2
# ==========================================================
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem: tarefas;DB_CLOSE_DELAY=-1;MODE=LEGACY
quarkus.datasource.username=sa
quarkus.datasource.password=
# ==========================================================
# HIBERNATE ORM / PANACHE
# ==========================================================
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false
# ==========================================================
# REST CLIENT - SERVIÇO DE SUGESTÃO DE PRIORIDADE
# ==========================================================
# Tempos máximos de conexão e leitura
quarkus.rest-client.prioridade-api.connect-timeout=1000
quarkus.rest-client.prioridade-api.read-timeout=2000
# URL por ambiente
%dev.quarkus.rest-client.prioridade-api.url=http://localhost:8089
%test.quarkus.rest-client.prioridade-api.url=http://localhost:9
%prod.quarkus.rest-client.prioridade-api.url=http://prioridade-api:8089
