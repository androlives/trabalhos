quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:tarefas;DB_CLOSE_DELAY=-1;MODE=LEGACY
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# Task 4: cliente HTTP. A variavel de ambiente funciona em todos os profiles.
quarkus.rest-client.prioridade-local.url=${PRIORIDADE_LOCAL_URL:http://127.0.0.1:8081}
quarkus.rest-client.prioridade-local.connect-timeout=1000
quarkus.rest-client.prioridade-local.read-timeout=1000
%dev.quarkus.rest-client.prioridade-local.url=${PRIORIDADE_LOCAL_URL:http://127.0.0.1:8081}
%staging.quarkus.rest-client.prioridade-local.url=${PRIORIDADE_LOCAL_URL:http://127.0.0.1:8082}

# Porta livre para testes locais e execucoes paralelas de outros projetos.
quarkus.http.test-port=0
